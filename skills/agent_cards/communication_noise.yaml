name: "communication_noise"
class: "AgentCommunicationNoise"
module: "agents/agent_communication_noise.py"
display_name: "Ruídos de Comunicação"
description: "Detecta ambiguidades, lacunas e dinâmica de turno (dominância de fala, interrupções, desqualificações) na transcrição"
pipeline_phase: "enrichment"
mode: "llm+deterministic"
fatal: false
reads:
  - "hub.transcript_clean"
  - "hub.nlp.actors"
  - "hub.minutes"
writes:
  - "hub.communication_noise"
  - "meetings.communication_noise_json (Supabase)"
artifacts:
  - "Lista de ambiguidades com severidade e sugestões"
  - "Lista de lacunas de comunicação (inclui turno interrompido/retomado, tema repetido rejeitado, desqualificação de falante — evidence-backed)"
  - "Dominância de fala por participante (determinístico, sem LLM)"
  - "Risco de atribuição de falante (dispositivo compartilhado — determinístico, sem LLM)"
  - "Índice de clareza (0–100)"
dependencies: ["nlp", "minutes"]
skill_file: "skills/skill_communication_noise.md"
